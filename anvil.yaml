    <script type="application/ld+json">{"@context": "https://schema.org", "@graph": [{"@type": "Service", "@id": "https://csuite-coach.anvil.app/#app", "name": "C-Suite Coach", "url": "https://csuite-coach.anvil.app/", "description": "Executive training for the C-suite: real business cases, boardroom challenges and spaced-repetition drills. Earn C-Suite Coach Institute certificates.", "image": "https://csuite-coach.anvil.app/_/theme/og-image.png", "serviceType": "Executive training for current and aspiring C-suite leaders", "provider": {"@id": "https://arkvital.com/#org"}, "areaServed": "Worldwide", "availableChannel": {"@type": "ServiceChannel", "serviceUrl": "https://csuite-coach.anvil.app/", "name": "Web browser"}, "availableLanguage": "en", "audience": {"@type": "Audience", "audienceType": "Current and aspiring CEOs, CFOs, COOs, CHROs, CTOs, CIOs, CISOs and CMOs"}}, {"@type": "WebSite", "@id": "https://csuite-coach.anvil.app/#site", "url": "https://csuite-coach.anvil.app/", "name": "C-Suite Coach", "publisher": {"@id": "https://arkvital.com/#org"}}, {"@type": "Organization", "@id": "https://arkvital.com/#org", "name": "Arkvital", "url": "https://arkvital.com", "email": "arkvital@outlook.com", "address": {"@type": "PostalAddress", "addressLocality": "Montreal", "addressRegion": "QC", "addressCountry": "CA"}}]}</script>
