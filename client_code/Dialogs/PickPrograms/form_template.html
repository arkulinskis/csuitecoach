<div class="ui-stack tm-dialog">
  <h2 class="cs-ph" anvil:dom-node="title"></h2>
  <p class="muted small">Ticked programs show on their dashboard as assigned by your team, and you follow their progress in each.</p>
  <anvil-component type="RepeatingPanel" name="picks_panel" prop:item_template="C_Suite_Coach.Items.TrackPick" prop:role='["tm-picks"]'></anvil-component>
  <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
  <div class="ui-row end">
    <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
    <anvil-component type="Button" name="save_button" prop:text="Save" prop:role='["btn", "btn-primary"]'></anvil-component>
  </div>
</div>
