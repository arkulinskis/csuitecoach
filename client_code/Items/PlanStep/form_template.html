<div class="nt-step-host">
  <div class="nt-step" anvil:name="row">
    <label class="nt-tick" anvil:name="tick_box"><input type="checkbox" anvil:dom-node="box"></label>
    <span class="nt-dot" anvil:name="dot" aria-hidden="true"></span>
    <div class="nt-txt">
      <p class="nt-text"><span anvil:dom-node="text"></span> <span class="ui-badge" anvil:dom-node="tag"></span></p>
      <p class="nt-why" anvil:dom-node="why"></p>
      <p class="nt-meta"><a anvil:dom-node="link"></a><span aria-hidden="true"> &middot; </span><a anvil:dom-node="src" target="_blank" rel="noopener"></a></p>
    </div>
  </div>
</div>
