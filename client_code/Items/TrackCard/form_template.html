<a class="cs-pcard" anvil:dom-node="a">
  <div class="img" anvil:dom-node="img">
    <span class="code" anvil:dom-node="code"></span>
    <span class="done ui-badge gold" anvil:dom-node="done" hidden><i class="ic ic-award"></i>Certified</span>
  </div>
  <div class="txt">
    <span class="role" anvil:dom-node="role"></span>
    <h3 anvil:dom-node="title"></h3>
    <p anvil:dom-node="blurb"></p>
    <div anvil:name="bar_box"><anvil-component type="C_Suite_Coach.Components.Bar" name="bar"></anvil-component></div>
    <div class="foot"><span anvil:dom-node="counts"></span><span anvil:dom-node="hours"></span></div>
  </div>
</a>
