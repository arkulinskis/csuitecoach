<div class="ch-rev-host">
  <div class="ch-rev" anvil:name="box">
    <div class="ch-rev-top"><b anvil:dom-node="who"></b><span anvil:dom-node="score"></span></div>
    <p class="small" anvil:dom-node="comment"></p>
    <div class="ui-row ch-rev-act" anvil:name="open_actions">
      <anvil-component type="Button" name="copy_button" prop:text="Copy link" prop:role='["btn", "btn-sm", "ic-copy"]'></anvil-component>
      <anvil-component type="Button" name="revoke_button" prop:text="Revoke" prop:role='["btn", "btn-sm", "btn-ghost", "ic-x"]'></anvil-component>
    </div>
  </div>
</div>
